<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ズームを禁止し、画面いっぱいに表示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>モバイルピアノ - Landscape Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white-key-width: 60px;
            --black-key-width: 36px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            /* テキスト選択や虫眼鏡などネイティブの長押し挙動を無効化 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
        }

        /* 鍵盤のデザイン */
        .piano-key {
            position: absolute;
            top: 0;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.05s ease, background 0.05s ease, box-shadow 0.05s ease;
        }

        .white-key {
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border: 1px solid #999;
            z-index: 1;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.2);
        }

        .white-key.active {
            background: linear-gradient(to bottom, #e0f2fe 0%, #bae6fd 100%);
            transform: translateY(2px);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
            border-color: #7dd3fc;
        }

        .black-key {
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            border: 1px solid #111;
            z-index: 2;
            box-shadow: inset 0 -1px 3px rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.5);
        }

        .black-key.active {
            background: linear-gradient(to bottom, #38bdf8 0%, #0284c7 100%);
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        /* 横スクロールエリアの最適化 */
        #keyboard-scroll-area {
            touch-action: pan-x; /* 横スクロールのみ許可 */
            -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロール */
            overflow-y: hidden;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox用スクロールバー非表示 */
        }
        #keyboard-scroll-area::-webkit-scrollbar {
            display: none; /* Chrome/Safari用スクロールバー非表示 */
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full text-slate-200">

    <!-- コントロールヘッダー (画面上部) -->
    <header class="flex-shrink-0 bg-slate-800 border-b border-slate-700 p-2 sm:p-3 flex flex-wrap items-center justify-between gap-2 shadow-md z-10">
        
        <!-- 左側：オクターブ＆トランスポーズ -->
        <div class="flex items-center gap-3">
            <div class="flex items-center bg-slate-700 rounded-lg p-1 px-2 gap-2">
                <span class="text-xs font-bold text-slate-400">OCT</span>
                <button id="btn-oct-down" class="w-8 h-8 bg-slate-600 active:bg-slate-500 rounded text-lg font-bold flex items-center justify-center">-</button>
                <span id="octave-display" class="font-mono font-bold w-6 text-center text-sm">C3</span>
                <button id="btn-oct-up" class="w-8 h-8 bg-slate-600 active:bg-slate-500 rounded text-lg font-bold flex items-center justify-center">+</button>
            </div>

            <div class="flex items-center bg-slate-700 rounded-lg p-1 px-2 gap-2">
                <span class="text-xs font-bold text-slate-400">TRANS</span>
                <button id="btn-trans-down" class="w-8 h-8 bg-slate-600 active:bg-slate-500 rounded text-lg font-bold flex items-center justify-center">-</button>
                <span id="transpose-display" class="font-mono font-bold w-8 text-center text-sm">0</span>
                <button id="btn-trans-up" class="w-8 h-8 bg-slate-600 active:bg-slate-500 rounded text-lg font-bold flex items-center justify-center">+</button>
            </div>
        </div>

        <!-- 右側：録音・MIDI書き出し -->
        <div class="flex items-center gap-3">
            <button id="btn-record" class="flex items-center gap-2 bg-slate-700 active:bg-slate-600 rounded-lg px-3 py-1.5 transition-colors">
                <div id="rec-indicator" class="w-3 h-3 rounded-full bg-slate-400"></div>
                <span id="rec-text" class="text-sm font-bold">REC</span>
            </button>
            <div id="rec-time" class="font-mono text-sm w-12 text-center">00:00</div>
            <button id="btn-export" disabled class="bg-blue-600 disabled:bg-slate-700 disabled:text-slate-500 active:bg-blue-500 rounded-lg px-3 py-1.5 text-sm font-bold transition-colors">
                MIDI保存
            </button>
        </div>
    </header>

    <!-- 鍵盤エリア (残り全画面・横スクロール) -->
    <main id="keyboard-scroll-area" class="flex-grow relative bg-zinc-900 w-full">
        <!-- JavaScriptで絶対座標指定により鍵盤が生成されるコンテナ -->
        <div id="keyboard-container" class="relative h-full"></div>
    </main>

    <!-- 通知用トースト -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-500 text-white px-4 py-2 rounded-full font-bold text-sm opacity-0 transition-opacity pointer-events-none z-50">
        Message
    </div>

    <script>
        /**
         * アプリケーション状態
         */
        let octaveK = 0;       // オクターブシフト (-3 ~ +3)
        let transposeN = 0;    // 半音シフト (-12 ~ +12)
        
        let audioCtx = null;
        let masterGain = null;
        const activeVoices = new Map();

        // 録音機能用
        let isRecording = false;
        let recordingStartTime = 0;
        let recordedEvents = [];
        let timerInterval = null;
        let secondsRecorded = 0;

        /**
         * 1. 鍵盤の動的生成処理 (MIDI 36[C2] ~ 84[C6])
         */
        const START_MIDI = 36;
        const END_MIDI = 84;
        
        function renderKeyboard() {
            const container = document.getElementById('keyboard-container');
            container.innerHTML = ''; // リセット

            const whiteKeyWidth = 60; // css var --white-key-width と一致させる
            const blackKeyWidth = 36; // css var --black-key-width と一致させる
            
            let whiteKeyCount = 0;

            for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
                const noteIndex = midi % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteIndex);
                
                const keyEl = document.createElement('div');
                keyEl.classList.add('piano-key');
                keyEl.dataset.midi = midi;
                
                if (isBlack) {
                    keyEl.classList.add('black-key');
                    // 黒鍵の位置：直前の白鍵の右端を中心に配置
                    const leftPos = (whiteKeyCount * whiteKeyWidth) - (blackKeyWidth / 2);
                    keyEl.style.left = `${leftPos}px`;
                    keyEl.style.width = `${blackKeyWidth}px`;
                    keyEl.style.height = '60%'; // 白鍵の60%の長さ
                } else {
                    keyEl.classList.add('white-key');
                    const leftPos = whiteKeyCount * whiteKeyWidth;
                    keyEl.style.left = `${leftPos}px`;
                    keyEl.style.width = `${whiteKeyWidth}px`;
                    keyEl.style.height = '100%';
                    
                    // 白鍵には音名ラベルを小さく表示 (Cの音のみ)
                    if (noteIndex === 0) {
                        const octave = Math.floor(midi / 12) - 1;
                        const label = document.createElement('div');
                        label.className = 'absolute bottom-2 w-full text-center text-slate-500 font-bold text-[10px] pointer-events-none';
                        label.innerText = `C${octave}`;
                        keyEl.appendChild(label);
                    }
                    whiteKeyCount++;
                }

                // イベントリスナーの登録 (preventDefaultしない)
                keyEl.addEventListener('pointerdown', handlePointerDown);
                keyEl.addEventListener('pointerup', handlePointerUp);
                keyEl.addEventListener('pointercancel', handlePointerUp);
                keyEl.addEventListener('pointerout', handlePointerUp);

                container.appendChild(keyEl);
            }

            // スクロールコンテナの総幅を白鍵の数×幅に設定し、スクロール領域を確保
            container.style.width = `${whiteKeyCount * whiteKeyWidth}px`;
        }

        /**
         * 2. Web Audio API による発音処理
         */
        function initAudio() {
            if (audioCtx) return;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.7;

            const compressor = audioCtx.createDynamicsCompressor();
            masterGain.connect(compressor);
            compressor.connect(audioCtx.destination);
        }

        function playNote(midiBaseNote, pointerId, keyEl) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // オクターブ＆トランスポーズを適用
            const finalMidi = midiBaseNote + (octaveK * 12) + transposeN;
            const freq = 440 * Math.pow(2, (finalMidi - 69) / 12);
            const now = audioCtx.currentTime;

            // シンプルなFMライクシンセ
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.value = freq;

            const osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle';
            osc2.frequency.value = freq;

            const env = audioCtx.createGain();
            env.gain.setValueAtTime(0, now);
            env.gain.linearRampToValueAtTime(0.5, now + 0.02); // アタック
            env.gain.exponentialRampToValueAtTime(0.1, now + 1.5); // ディケイ

            osc1.connect(env);
            osc2.connect(env);
            env.connect(masterGain);

            osc1.start(now);
            osc2.start(now);

            activeVoices.set(pointerId, { osc1, osc2, env, finalMidi });
            keyEl.classList.add('active');

            // 録音処理
            if (isRecording) {
                recordedEvents.push({ type: 'noteOn', note: finalMidi, time: now - recordingStartTime });
            }
        }

        function stopNote(pointerId, keyEl) {
            if (!activeVoices.has(pointerId)) return;
            const voice = activeVoices.get(pointerId);
            const now = audioCtx ? audioCtx.currentTime : 0;

            if (audioCtx) {
                // リリース処理
                voice.env.gain.cancelScheduledValues(now);
                voice.env.gain.setValueAtTime(voice.env.gain.value, now);
                voice.env.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                
                setTimeout(() => {
                    try {
                        voice.osc1.stop();
                        voice.osc2.stop();
                        voice.osc1.disconnect();
                        voice.osc2.disconnect();
                        voice.env.disconnect();
                    } catch(e){}
                }, 150);
            }

            if (isRecording) {
                recordedEvents.push({ type: 'noteOff', note: voice.finalMidi, time: now - recordingStartTime });
            }

            activeVoices.delete(pointerId);
            keyEl.classList.remove('active');
        }

        /**
         * 3. イベントハンドラ (スクロールを阻害しない)
         */
        function handlePointerDown(e) {
            // 右クリックなどは無視
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            
            // 指でのタップ時に発音（※ここでは e.preventDefault() を行わないため横スクロール可能）
            const midi = parseInt(this.dataset.midi);
            // Element capture to handle release outside
            this.setPointerCapture(e.pointerId);
            playNote(midi, e.pointerId, this);
        }

        function handlePointerUp(e) {
            if (this.hasPointerCapture(e.pointerId)) {
                this.releasePointerCapture(e.pointerId);
            }
            stopNote(e.pointerId, this);
        }

        /**
         * 4. UI コントロール・録音機能
         */
        function updateDisplay() {
            document.getElementById('octave-display').innerText = `C${3 + octaveK}`;
            document.getElementById('transpose-display').innerText = transposeN > 0 ? `+${transposeN}` : transposeN;
        }

        document.getElementById('btn-oct-down').addEventListener('click', () => { octaveK = Math.max(-3, octaveK - 1); updateDisplay(); });
        document.getElementById('btn-oct-up').addEventListener('click', () => { octaveK = Math.min(3, octaveK + 1); updateDisplay(); });
        document.getElementById('btn-trans-down').addEventListener('click', () => { transposeN = Math.max(-12, transposeN - 1); updateDisplay(); });
        document.getElementById('btn-trans-up').addEventListener('click', () => { transposeN = Math.min(12, transposeN + 1); updateDisplay(); });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        // 録音トグル
        document.getElementById('btn-record').addEventListener('click', () => {
            initAudio();
            const recIndicator = document.getElementById('rec-indicator');
            const recText = document.getElementById('rec-text');
            const btnExport = document.getElementById('btn-export');
            
            if (!isRecording) {
                // 録音開始
                isRecording = true;
                recordedEvents = [];
                recordingStartTime = audioCtx.currentTime;
                secondsRecorded = 0;
                
                recIndicator.classList.replace('bg-slate-400', 'bg-red-500');
                recIndicator.classList.add('animate-pulse');
                recText.classList.add('text-red-500');
                btnExport.disabled = true;
                
                document.getElementById('rec-time').innerText = '00:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const m = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
                    const s = String(secondsRecorded % 60).padStart(2, '0');
                    document.getElementById('rec-time').innerText = `${m}:${s}`;
                }, 1000);
                showToast("録音を開始しました");
            } else {
                // 録音停止
                isRecording = false;
                clearInterval(timerInterval);
                
                recIndicator.classList.replace('bg-red-500', 'bg-slate-400');
                recIndicator.classList.remove('animate-pulse');
                recText.classList.remove('text-red-500');
                
                if (recordedEvents.length > 0) {
                    btnExport.disabled = false;
                    showToast("録音が完了しました。MIDIで保存可能です。");
                } else {
                    showToast("録音データがありません");
                }
            }
        });

        // 簡易 MIDI (.mid) 書き出しエンジン
        document.getElementById('btn-export').addEventListener('click', () => {
            if (recordedEvents.length === 0) return;
            const bpm = 120;
            const ppq = 480; 
            const ticksPerSecond = (bpm / 60.0) * ppq;
            
            const sorted = [...recordedEvents].sort((a, b) => a.time - b.time);
            let trackBytes = [];

            // Tempo Event & Time Sig
            const mpqn = Math.round(60000000 / bpm);
            trackBytes.push(0x00, 0xFF, 0x51, 0x03, (mpqn >> 16) & 0xFF, (mpqn >> 8) & 0xFF, mpqn & 0xFF);
            trackBytes.push(0x00, 0xFF, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08);

            function encodeVLQ(val) {
                let res = [];
                let v = Math.round(val);
                res.push(v & 0x7F);
                v >>= 7;
                while (v > 0) {
                    res.unshift((v & 0x7F) | 0x80);
                    v >>= 7;
                }
                return res;
            }

            let lastTick = 0;
            sorted.forEach(ev => {
                const currentTick = Math.max(0, Math.round(ev.time * ticksPerSecond));
                const delta = Math.max(0, currentTick - lastTick);
                lastTick = currentTick;

                trackBytes.push(...encodeVLQ(delta));
                if (ev.type === 'noteOn') {
                    trackBytes.push(0x90, ev.note & 0x7F, 100);
                } else {
                    trackBytes.push(0x80, ev.note & 0x7F, 0x00);
                }
            });
            trackBytes.push(0x00, 0xFF, 0x2F, 0x00); // EOT

            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, (ppq >> 8) & 0xFF, ppq & 0xFF];
            const trackLen = trackBytes.length;
            const trackHeader = [0x4D, 0x54, 0x72, 0x6B, (trackLen >> 24) & 0xFF, (trackLen >> 16) & 0xFF, (trackLen >> 8) & 0xFF, trackLen & 0xFF];

            const midiData = new Uint8Array([...header, ...trackHeader, ...trackBytes]);
            const blob = new Blob([midiData], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `mobile_piano.mid`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("MIDIを保存しました！");
        });

        // 初期化実行
        window.addEventListener('DOMContentLoaded', () => {
            renderKeyboard();
            // 初期スクロール位置を真ん中付近(C3,C4あたり)に設定
            const scrollArea = document.getElementById('keyboard-scroll-area');
            scrollArea.scrollLeft = 250;
        });

    </script>
</body>
</html>
